services:
  gateway:
    build:
      context: ./gateway
    ports:
      - 8080:8080
  userservice:
    build:
      context: ./userservice
    ports:
      - 8082:8082
    environment:
      - DB_URL=${USER_DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${USER_DB_NAME}
      - DB_HOST=db
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      user_db:
        condition: service_healthy
      redis:
        condition: service_healthy
  authservice:
    build:
      context: ./authservice
    ports:
      - 8081:8081
    environment:
      - DB_URL=${AUTH_DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${AUTH_DB_NAME}
      - DB_HOST=db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_ACCESS=${JWT_EXPIRATION_ACCESS}
      - JWT_EXPIRATION_REFRESH=${JWT_EXPIRATION_REFRESH}
    depends_on:
      db:
        condition: service_healthy
  orderservice:
    build:
      context: ./orderservice
    ports:
      - 8083:8083
    environment:
      - DB_URL=${ORDER_DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${ORDER_DB_NAME}
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
  user_db:
    image: postgres:latest
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_DB=${USER_DB_NAME}
    expose:
      - 5432
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    redis:
      image: redis:latest
      restart: unless-stopped
      ports:
        - "6379:6379"
      environment:
        - REDIS_PASSWORD=${REDIS_PASSWORD}
      command: redis-server --requirepass ${REDIS_PASSWORD}
      healthcheck:
        test: [ "CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG" ]
        interval: 10s
        timeout: 5s
        retries: 5
      volumes:
        - redisdb-data:/data
  auth_db:
    image: postgres:latest
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_DB=${AUTH_DB_NAME}
    expose:
      - 5432
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
  order_db:
    image: postgres:latest
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_DB=${ORDER_DB_NAME}
    expose:
      - 5432
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
  volumes:
    db-data:
    redisdb-data:


