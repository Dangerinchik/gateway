server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/token/login,/token/validate,/token/refresh,/token/save
              filters:
                - LoggingFilter

            - id: user-service
              uri: http://localhost:8082
              predicates:
                - Path=/user/**,/card/**
              filters:
                - AuthValidationFilter
                - LoggingFilter

            - id: order-service
              uri: http://localhost:8083
              predicates:
                - Path=/order/**,/item/**
              filters:
                - AuthValidationFilter
                - LoggingFilter
